[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "georeservoir"
version = "0.1.1"
description = "GeoReservoir AI — auditable subsurface engineering scientific core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — all rights reserved (see LICENSE, ADR-0002)" }
authors = [{ name = "Marcos Zola Daniel João" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/georeservoir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "validation: validation case linked to tests/validation/cases/*.json",
]

[tool.coverage.run]
source = ["georeservoir"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["georeservoir"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
